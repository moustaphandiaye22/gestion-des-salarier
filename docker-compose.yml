services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: payroll_backend
    env_file:
      - ./backend/.env
    ports:
      - "3015:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:3015
    container_name: payroll_frontend
    ports:
      - "8080:80"
    restart: unless-stopped
